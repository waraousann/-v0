let currentIndex = 0;
let isAnswerShown = false;

function updateCard() {
  const card = flashcards[currentIndex];
  document.getElementById('progress').innerText = `${currentIndex + 1} / ${flashcards.length}`;
  document.getElementById('category').innerText = card.cat;
  document.getElementById('question').innerText = card.q;
  document.getElementById('answer').innerText = card.a;
  
  document.getElementById('answer').style.display = 'none';
  document.getElementById('hint').style.display = 'block';
  isAnswerShown = false;
}

function toggleAnswer() {
  const answerEl = document.getElementById('answer');
  const hintEl = document.getElementById('hint');
  if (isAnswerShown) {
    answerEl.style.display = 'none';
    hintEl.style.display = 'block';
    isAnswerShown = false;
  } else {
    answerEl.style.display = 'block';
    hintEl.style.display = 'none';
  }
}

function nextCard(isCorrect) {
  if (isCorrect) {
    currentIndex = (currentIndex + 1) % flashcards.length;
  } else {
    flashcards.push(flashcards[currentIndex]);
    currentIndex = (currentIndex + 1) % flashcards.length;
  }
  updateCard();
}

function shuffleCards() {
  for (let i = flashcards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [flashcards[i], flashcards[j]] = [flashcards[j], flashcards[i]];
  }
  currentIndex = 0;
  updateCard();
}

updateCard();
